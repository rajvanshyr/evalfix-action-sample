name: Agent evals

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  evalfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate support agent
        uses: ./evalfix-action
        with:
          project_dir: agents/support
          suggest_fix: "true"
          fail_on_regression: "true"
          baseline: base-branch
          max_cases: "100"
          timeout_minutes: "15"
          comment: "true"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
